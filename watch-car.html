<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Car - VideoFlow</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">

        <button class="menu-button">☰</button>

        <a href="index.html" class="logo">
            ▶ VideoFlow
        </a>

        <div class="search-container">
            <input type="text" placeholder="Search">
            <button>🔍</button>
        </div>

        <div class="header-actions">
            <button>🎤</button>
            <button>＋</button>
            <button>🔔</button>
            <button>👤</button>
        </div>

    </header>


    <main class="watch-page">

        <div class="watch-layout">

            <!-- MAIN VIDEO AREA -->

            <section class="player-section">

                <div class="player">

                    <iframe width="839" height="472" 
                        src="https://www.youtube.com/embed/D-f0yVjYBRQ" 
                        title="7 Future Concept Cars YOU MUST SEE" 
                        frameborder="0" allow="accelerometer; autoplay; 
                        clipboard-write; encrypted-media; gyroscope; 
                        picture-in-picture; web-share" 
                        referrerpolicy="strict-origin-when-cross-origin" 
                        allowfullscreen>
                    </iframe>

                </div>


                <h1 class="watch-title">
                    showing car
                </h1>


                <div class="channel-row">

                    <div class="channel-info">

                        <img
                            src="images/avatars/almost_done_of_create_idea.jpg"
                            alt="Car channel">

                        <div class="channel-text">

                            <span class="channel-name">
                                Auto World
                            </span>

                            <span class="subscribers">
                                25K subscribers
                            </span>

                        </div>

                    </div>


                    <button class="subscribe-btn">
                        Subscribe
                    </button>

                </div>


                <div class="watch-actions">

                    <button class="action-btn">
                        👍 Like
                    </button>

                    <button class="action-btn">
                        ↗ Share
                    </button>

                    <button class="action-btn">
                        ⋯ More
                    </button>

                </div>


                <div class="video-meta">
                    856K views • 3 days ago
                </div>


                <div class="video-description">

                    Weclome to our car group,
                    here is best cars of video,
                    follow us, you will Learn more about car

                </div>

            </section>


            <!-- RECOMMENDED VIDEOS -->

            <aside class="recommended">

                <h2>
                    Recommended
                </h2>

                <div class="recommended-list">

                    <a href="watch-city.html" class="recommended-card">

                        <div class="recommended-thumbnail">

                            <img
                                src="images/thumbnails/city.jpg"
                                alt="city video">

                        </div>

                        <div class="recommended-info">

                            <h3 class="recommended-title">
                                showing city
                            </h3>

                            <p class="recommended-channel">
                                City Explorer
                            </p>

                            <p class="recommended-meta">
                                290k views
                            </p>

                        </div>

                    </a>


                    <a href="watch-coding.html" class="recommended-card">

                        <div class="recommended-thumbnail">

                            <img
                                src="images/thumbnails/HTML5 _and_CSS3.jpg"
                                alt="coding video">

                        </div>

                        <div class="recommended-info">

                            <h3 class="recommended-title">
                                learning code
                            </h3>

                            <p class="recommended-channel">
                                Developer Hub
                            </p>

                            <p class="recommended-meta">
                                420K views
                            </p>

                        </div>

                    </a>

                </div>

            </aside>

        </div>

    </main>

</body>

</html>
