<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel - VideoFlow</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">

        <button class="menu-button">☰</button>

        <a href="index.html" class="logo">
            ▶ VideoFlow
        </a>

        <div class="search-container">
            <input type="text" placeholder="Search">
            <button>🔍</button>
        </div>

        <div class="header-actions">
            <button>🎤</button>
            <button>＋</button>
            <button>🔔</button>
            <button>👤</button>
        </div>

    </header>


    <main class="watch-page">

        <div class="watch-layout">

            <!-- MAIN VIDEO AREA -->

            <section class="player-section">

                <div class="player">

                    <iframe width="839" height="472" 
                        src="https://www.youtube.com/embed/exI_hD_4jAM" 
                        title="Best Travel Destinations in The World 4K" 
                        frameborder="0" allow="accelerometer; autoplay; 
                        clipboard-write; encrypted-media; gyroscope; 
                        picture-in-picture; web-share" 
                        referrerpolicy="strict-origin-when-cross-origin" 
                        allowfullscreen>
                    </iframe>

                </div>


                <h1 class="watch-title">
                    Sea travel
                </h1>


                <div class="channel-row">

                    <div class="channel-info">

                        <img
                            src="images/avatars/mountain3.jpg"
                            alt="Travel channel">

                        <div class="channel-text">

                            <span class="channel-name">
                                Travel Guide
                            </span>

                            <span class="subscribers">
                                5K subscribers
                            </span>

                        </div>

                    </div>


                    <button class="subscribe-btn">
                        Subscribe
                    </button>

                </div>


                <div class="watch-actions">

                    <button class="action-btn">
                        👍 Like
                    </button>

                    <button class="action-btn">
                        ↗ Share
                    </button>

                    <button class="action-btn">
                        ⋯ More
                    </button>

                </div>


                <div class="video-meta">
                    850K views • 3 days ago
                </div>


                <div class="video-description">

                    Welcome to our team of guide,
                    we are travel guide for your travel,
                    Let's go!!!

                </div>

            </section>


            <!-- RECOMMENDED VIDEOS -->

            <aside class="recommended">

                <h2>
                    Recommended
                </h2>

                <div class="recommended-list">

                    <a href="watch-workout.html" class="recommended-card">

                        <div class="recommended-thumbnail">

                            <img
                                src="images/thumbnails/workout.jpg"
                                alt="workout video">

                        </div>

                        <div class="recommended-info">

                            <h3 class="recommended-title">
                                Best workout
                            </h3>

                            <p class="recommended-channel">
                                Sport Group
                            </p>

                            <p class="recommended-meta">
                                678K views
                            </p>

                        </div>

                    </a>


                    <a href="watch-car.html" class="recommended-card">

                        <div class="recommended-thumbnail">

                            <img
                                src="images/thumbnails/car.jpg"
                                alt="car video">

                        </div>

                        <div class="recommended-info">

                            <h3 class="recommended-title">
                                showing car 
                            </h3>

                            <p class="recommended-channel">
                                Auto World
                            </p>

                            <p class="recommended-meta">
                                290K views
                            </p>

                        </div>

                    </a>

                </div>

            </aside>

        </div>

    </main>

</body>

</html>
