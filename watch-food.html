<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food - VideoFlow</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">

        <button class="menu-button">☰</button>

        <a href="index.html" class="logo">
            ▶ VideoFlow
        </a>

        <div class="search-container">
            <input type="text" placeholder="Search">
            <button>🔍</button>
        </div>

        <div class="header-actions">
            <button>🎤</button>
            <button>＋</button>
            <button>🔔</button>
            <button>👤</button>
        </div>

    </header>


    <main class="watch-page">

        <div class="watch-layout">

            <!-- MAIN VIDEO AREA -->

            <section class="player-section">

                <div class="player">

                    <iframe width="839" height="472" 
                        src="https://www.youtube.com/embed/05f8sG4OhZs" 
                        title="Garlic Butter Steaks and Campfire Potatoes Outdoors" 
                        frameborder="0" allow="accelerometer; autoplay; clipboard-write; 
                        encrypted-media; gyroscope; picture-in-picture; web-share" 
                        referrerpolicy="strict-origin-when-cross-origin" 
                        allowfullscreen>
                    </iframe>

                </div>


                <h1 class="watch-title">
                    hot food, hot meal
                </h1>


                <div class="channel-row">

                    <div class="channel-info">

                        <img
                            src="images/avatars/music.jpg"
                            alt="food channel">

                        <div class="channel-text">

                            <span class="channel-name">
                                teacher of cooker
                            </span>

                            <span class="subscribers">
                                100k subscribers
                            </span>

                        </div>

                    </div>


                    <button class="subscribe-btn">
                        Subscribe
                    </button>

                </div>


                <div class="watch-actions">

                    <button class="action-btn">
                        👍 Like
                    </button>

                    <button class="action-btn">
                        ↗ Share
                    </button>

                    <button class="action-btn">
                        ⋯ More
                    </button>

                </div>


                <div class="video-meta">
                    1.2M views • 3 days ago
                </div>


                <div class="video-description">

                    Welcome to our page of cooking,
                    we are teacher of cooker
                    follow us! you will learn more about how to cook!!!

                </div>

            </section>


            <!-- RECOMMENDED VIDEOS -->

            <aside class="recommended">

                <h2>
                    Recommended
                </h2>

                <div class="recommended-list">

                    <a href="watch-gaming.html" class="recommended-card">

                        <div class="recommended-thumbnail">

                            <img
                                src="images/thumbnails/Gaming.jpg"
                                alt="gaming video">

                        </div>

                        <div class="recommended-info">

                            <h3 class="recommended-title">
                                Pro gaming
                            </h3>

                            <p class="recommended-channel">
                                pro gamer
                            </p>

                            <p class="recommended-meta">
                                856K views
                            </p>

                        </div>

                    </a>


                    <a href="watch-moutain.html" class="recommended-card">

                        <div class="recommended-thumbnail">

                            <img
                                src="images/thumbnails/mountain.jpg"
                                alt="mountain video">

                        </div>

                        <div class="recommended-info">

                            <h3 class="recommended-title">
                                travel to mountain
                            </h3>

                            <p class="recommended-channel">
                                mountain life
                            </p>

                            <p class="recommended-meta">
                                610K views
                            </p>

                        </div>

                    </a>

                </div>

            </aside>

        </div>

    </main>

</body>

</html>
