<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gaming - VideoFlow</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">

        <button class="menu-button">☰</button>

        <a href="index.html" class="logo">
            ▶ VideoFlow
        </a>

        <div class="search-container">
            <input type="text" placeholder="Search">
            <button>🔍</button>
        </div>

        <div class="header-actions">
            <button>🎤</button>
            <button>＋</button>
            <button>🔔</button>
            <button>👤</button>
        </div>

    </header>


    <main class="watch-page">

        <div class="watch-layout">

            <!-- MAIN VIDEO AREA -->

            <section class="player-section">

                <div class="player">

                    <iframe width="839" height="472" src="https://www.youtube.com/embed/tBSKvFii4f0" 
                        title="(Vector,Vectorier)Final,Custom Story 15 (2k SUBS SPECIAL!!!)" frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope;
                        picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin"
                        allowfullscreen>
                    </iframe>

                </div>


                <h1 class="watch-title">
                    Amazing Gaming Adventure
                </h1>


                <div class="channel-row">

                    <div class="channel-info">

                        <img
                            src="images/avatars/AI2.jpg"
                            alt="Gaming channel">

                        <div class="channel-text">

                            <span class="channel-name">
                                Game World
                            </span>

                            <span class="subscribers">
                                856K subscribers
                            </span>

                        </div>

                    </div>


                    <button class="subscribe-btn">
                        Subscribe
                    </button>

                </div>


                <div class="watch-actions">

                    <button class="action-btn">
                        👍 Like
                    </button>

                    <button class="action-btn">
                        ↗ Share
                    </button>

                    <button class="action-btn">
                        ⋯ More
                    </button>

                </div>


                <div class="video-meta">
                    856K views • 3 days ago
                </div>


                <div class="video-description">

                    Welcome to our gaming adventure.
                    Enjoy this gameplay video and explore
                    the world of gaming.

                </div>

            </section>


            <!-- RECOMMENDED VIDEOS -->

            <aside class="recommended">

                <h2>
                    Recommended
                </h2>

                <div class="recommended-list">

                    <a href="watch-moutain.html" class="recommended-card">

                        <div class="recommended-thumbnail">

                            <img
                                src="images/thumbnails/mountain.jpg"
                                alt="mountain video">

                        </div>

                        <div class="recommended-info">

                            <h3 class="recommended-title">
                                Learning python
                            </h3>

                            <p class="recommended-channel">
                                Hacker Group
                            </p>

                            <p class="recommended-meta">
                                120K views
                            </p>

                        </div>

                    </a>


                    <a href="watch-music.html" class="recommended-card">

                        <div class="recommended-thumbnail">

                            <img
                                src="images/thumbnails/high_music.jpg"
                                alt="music video">

                        </div>

                        <div class="recommended-info">

                            <h3 class="recommended-title">
                                Sea travel
                            </h3>

                            <p class="recommended-channel">
                                Travel Guide
                            </p>

                            <p class="recommended-meta">
                                432K views
                            </p>

                        </div>

                    </a>

                </div>

            </aside>

        </div>

    </main>

</body>

</html>
