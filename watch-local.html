<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Local Video - VideoFlow</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <button class="menu-button">☰</button>

        <a href="index.html" class="logo">
            ▶ VideoFlow
        </a>

        <div class="search-container">
            <input type="text" placeholder="Search">
            <button>🔍</button>
        </div>

        <div class="header-actions">
            <button>🎤</button>
            <button>＋</button>
            <button>🔔</button>
            <button>👤</button>
        </div>

    </header>


    <!-- MAIN WATCH PAGE -->
    <main class="watch-page">

        <div class="watch-layout">

            <!-- LEFT SIDE -->
            <section class="player-section">

                <!-- LOCAL MP4 PLAYER -->
                <div class="player">

                    <video controls>
                        <source
                            src="videos/nature_test_video.mp4"
                            type="video/mp4">

                        Your browser does not support
                        the video element.

                    </video>

                </div>


                <!-- TITLE -->
                <h1 class="watch-title">
                    My Local Video
                </h1>


                <!-- CHANNEL -->
                <div class="channel-row">

                    <div class="channel-info">

                        <img
                            src="images/avatars/laughing.jpg"
                            alt="VideoFlow channel avatar">

                        <div class="channel-text">

                            <span class="channel-name">
                                VideoFlow
                            </span>

                            <span class="subscribers">
                                1k subscribers
                            </span>

                        </div>

                    </div>

                    <button class="subscribe-btn">
                        Subscribe
                    </button>

                </div>


                <!-- ACTIONS -->
                <div class="watch-actions">

                    <button class="action-btn">
                        👍 Like
                    </button>

                    <button class="action-btn">
                        ↗ Share
                    </button>

                    <button class="action-btn">
                        ⋯ More
                    </button>

                </div>


                <!-- VIDEO INFORMATION -->
                <div class="video-meta">
                    Local video • VideoFlow
                </div>


                <!-- DESCRIPTION -->
                <div class="video-description">

                    This is a local MP4 video
                    played directly from the project folder.

                </div>

            </section>


            <!-- RIGHT SIDE -->
            <aside class="recommended">

                <h2>Recommended</h2>

                <div class="recommended-list">

                    <a
                        href="watch-gaming.html"
                        class="recommended-card">

                        <div class="recommended-thumbnail">

                            <img
                                src="images/thumbnails/gaming.jpg"
                                alt="Gaming video">

                        </div>

                        <div class="recommended-info">

                            <h3 class="recommended-title">
                                Amazing Gaming Adventure
                            </h3>

                            <p class="recommended-channel">
                                Game World
                            </p>

                            <p class="recommended-meta">
                                856K views
                            </p>

                        </div>

                    </a>


                    <a
                        href="watch-python.html"
                        class="recommended-card">

                        <div class="recommended-thumbnail">

                            <img
                                src="images/thumbnails/python.jpg"
                                alt="Python programming video">

                        </div>

                        <div class="recommended-info">

                            <h3 class="recommended-title">
                                Learning Python
                            </h3>

                            <p class="recommended-channel">
                                Hacker Group
                            </p>

                            <p class="recommended-meta">
                                120K views
                            </p>

                        </div>

                    </a>

                </div>

            </aside>

        </div>

    </main>

</body>

</html>
