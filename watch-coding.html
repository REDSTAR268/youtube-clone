<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>coding - VideoFlow</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">

        <button class="menu-button">☰</button>

        <a href="index.html" class="logo">
            ▶ VideoFlow
        </a>

        <div class="search-container">
            <input type="text" placeholder="Search">
            <button>🔍</button>
        </div>

        <div class="header-actions">
            <button>🎤</button>
            <button>＋</button>
            <button>🔔</button>
            <button>👤</button>
        </div>

    </header>


    <main class="watch-page">

        <div class="watch-layout">

            <!-- MAIN VIDEO AREA -->

            <section class="player-section">

                <div class="player">

                    <iframe width="839" height="472" 
                        src="https://www.youtube.com/embed/EFmxPMdBqmU" 
                        title="Animation vs. Coding" frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; 
                        encrypted-media; gyroscope; picture-in-picture; web-share" 
                        referrerpolicy="strict-origin-when-cross-origin" 
                        allowfullscreen>
                    </iframe>

                </div>


                <h1 class="watch-title">
                    coding world
                </h1>


                <div class="channel-row">

                    <div class="channel-info">

                        <img
                            src="images/avatars/hacker2.jpg"
                            alt="coding channel">

                        <div class="channel-text">

                            <span class="channel-name">
                                Developer Hub
                            </span>

                            <span class="subscribers">
                                12k subscribers
                            </span>

                        </div>

                    </div>


                    <button class="subscribe-btn">
                        Subscribe
                    </button>

                </div>


                <div class="watch-actions">

                    <button class="action-btn">
                        👍 Like
                    </button>

                    <button class="action-btn">
                        ↗ Share
                    </button>

                    <button class="action-btn">
                        ⋯ More
                    </button>

                </div>


                <div class="video-meta">
                    420K views • 3 days ago
                </div>


                <div class="video-description">

                    Welcome to our coding Group,
                    we are teacher of code,
                    Let's diving the code world!!!

                </div>

            </section>


            <!-- RECOMMENDED VIDEOS -->

            <aside class="recommended">

                <h2>
                    Recommended
                </h2>

                <div class="recommended-list">

                    <a href="watch-food.html" class="recommended-card">

                        <div class="recommended-thumbnail">

                            <img
                                src="images/thumbnails/food2.jpg"
                                alt="food video">

                        </div>

                        <div class="recommended-info">

                            <h3 class="recommended-title">
                                hot food, hot meal
                            </h3>

                            <p class="recommended-channel">
                                teacher of cooker
                            </p>

                            <p class="recommended-meta">
                                1.2M views
                            </p>

                        </div>

                    </a>


                    <a href="watch-gaming.html" class="recommended-card">

                        <div class="recommended-thumbnail">

                            <img
                                src="images/thumbnails/Gaming.jpg"
                                alt="gaming video">

                        </div>

                        <div class="recommended-info">

                            <h3 class="recommended-title">
                                pro gaming
                            </h3>

                            <p class="recommended-channel">
                                game world
                            </p>

                            <p class="recommended-meta">
                                856K views
                            </p>

                        </div>

                    </a>

                </div>

            </aside>

        </div>

    </main>

</body>

</html>
