<!DOCTYPE html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"

    <title>Shorts - VideoFlow</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <button class="menu-button">
            ☰
        </button>


        <a
            href="index.html"
            class="logo"
        >
            ▶ VideoFlow
        </a>


        <div class="search-container">

            <input
                type="text"
                class="search-box"
                placeholder="Search"
            >

            <button class="search-button">
                🔍
            </button>

        </div>


        <div class="header-actions">

            <button>
                ➕
            </button>

            <button>
                🔔
            </button>

            <button>
                👤
            </button>

        </div>

    </header>



    <!-- =====================================================
         SHORTS PAGE
    ====================================================== -->

    <main class="shorts-page">


        <h1>Shorts</h1>


        <p>
            Watch short videos on VideoFlow.
        </p>

             SHORTS GRID
        ================================================== -->

        <section class="shorts-grid">



            <!-- =================================================
                 SHORT 1
            ================================================== -->

            <article class="short-card">


                <div class="short-video">

                    <!--
                    PASTE YOUR YOUTUBE EMBED CODE HERE.

                    Example place:

                    <iframe
                        src="YOUR_EMBED_CODE_HERE"
                        title="Short video"
                        allowfullscreen>
                    </iframe>
                    -->

                    <iframe width="712" height="472" 
                        src="https://www.youtube.com/embed/fP6MXjVfG7M" 
                        title="do not disturb the abyss princess." 
                        frameborder="0" allow="accelerometer; 
                        autoplay; clipboard-write; encrypted-media; 
                        gyroscope; picture-in-picture; web-share" 
                        referrerpolicy="strict-origin-when-cross-origin" 
                        allowfullscreen>
                    </iframe>

                </div>


                <div class="short-info">

                    <img
                        class="short-avatar"
                        src="images/avatars/Furina.jpg"
                        alt="Channel avatar"
                    >


                    <div class="short-text">

                        <h2 class="short-title">
                            funny Moment
                        </h2>

                        <p class="short-channel">
                            Genshin impact
                        </p>
